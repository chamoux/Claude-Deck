[package]
name = "deck-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "deck-host"
path = "src/main.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[dependencies]
deck-core.workspace = true
deck-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
portable-pty = "0.9.0"
vt100 = "0.18.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects",
]

[dev-dependencies]
tempfile.workspace = true
