[package]
name = "claude-deck"
version.workspace = true
description = "Claude Deck window"
publish.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
deck-host = { path = "../../crates/deck-host" }
deck-proto = { path = "../../crates/deck-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plan usage for the footer. native-tls is Windows' own TLS (schannel).
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
